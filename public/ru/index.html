<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><meta name="color-scheme" content="dark"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png"><title>𖦏 opel | Dashboard</title>
<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:inherit;text-decoration:none}a:hover{color:var(--text)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}.sidebar{background:#070707;border-right:1px solid var(--border);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;border-bottom:1px solid var(--border-soft)}.mark{height:31px;width:31px;border-radius:7px;display:grid;place-items:center;background:#ededed;color:#050505;font-weight:800;font-size:19px}.brand b{font-size:15px;letter-spacing:-.4px}.brand small{display:block;font-size:11px;color:var(--muted);margin-top:-2px}.nav-title{font-size:11px;font-weight:600;color:var(--subtle);padding:0 11px;text-transform:uppercase;letter-spacing:.07em;margin:5px 0 6px}.nav{display:flex;flex-direction:column;gap:3px}.nav button{border:0;background:transparent;color:#aaaaaa;display:flex;align-items:center;gap:12px;text-align:left;width:100%;border-radius:6px;padding:9px 11px;font-weight:500}.nav button:hover{background:#0d0d0d;color:var(--text)}.nav button.active{background:#171717;color:var(--text);font-weight:600}.nav svg{width:16px;height:16px;stroke-width:1.7;flex:none}.sidebar-bottom{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--border-soft);font-size:11px;color:var(--muted)}.sidebar-bottom a{color:var(--accent)}
.main{min-width:0}.topbar{background:#070707;height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 32px}.crumb{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12px}.crumb strong{color:var(--text);font-weight:600}.top-actions{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--border);border-radius:30px;padding:5px 10px;font-size:11px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:6px}.dot.error{background:var(--red)}.btn,.select{border:1px solid var(--border);background:#111111;color:var(--text);border-radius:6px;padding:6px 11px;min-height:32px}.btn:hover,.select:hover{background:#1c1c1c}.btn.primary{background:#1e5032;border-color:#28613c;color:white}.btn.primary:hover{background:#28613c}.btn.flat{background:transparent}.btn.small{padding:4px 9px;min-height:28px;font-size:12px}.mobile-menu{display:none}.content{max-width:1380px;margin:auto;padding:32px 36px 55px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:27px}.eyebrow{color:var(--muted);font-size:12px;margin-bottom:4px}.page-head h1{font-size:25px;line-height:1.3;letter-spacing:-.6px;margin:0;font-weight:650}.page-head p{color:var(--muted);margin:7px 0 0;font-size:13px}.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.divider{height:1px;background:var(--border);margin:26px 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:0 0 13px}.section-head h2{font-size:14px;font-weight:600;margin:0}.section-head p{margin:2px 0 0;color:var(--muted);font-size:12px}.section-link{color:var(--accent);background:none;border:0;padding:0;font-size:12px}.section-link:hover{text-decoration:underline}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{background:#090909;border:1px solid var(--border);border-radius:6px;padding:16px 17px;min-width:0}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:27px;font-weight:600;letter-spacing:-.8px;margin-top:8px;line-height:1.3;font-variant-numeric:tabular-nums}.metric .note{color:var(--subtle);font-size:11px;margin-top:8px}.grid{display:grid;gap:16px}.two{grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr)}.equal{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{background:#080808;border:1px solid var(--border);border-radius:6px;min-width:0;overflow:hidden}.panel-header{padding:15px 17px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-header h3{font-size:13px;margin:0;font-weight:600}.panel-header small{font-size:11px;color:var(--muted)}.panel-body{padding:17px}.chart{height:245px;display:flex;align-items:flex-end;gap:2px;padding:8px 1px 23px;border-bottom:1px solid var(--border-soft);overflow:hidden;min-width:0;width:100%}.bar-col{height:100%;min-width:0;flex:1 1 0;display:flex;align-items:flex-end;position:relative}.bar{width:100%;min-height:2px;background:#696969;border-radius:2px 2px 0 0}.bar:hover{background:var(--accent)}.bar-col span{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--subtle);white-space:nowrap}.chart:has(.empty){display:grid;place-items:center}.rows{display:flex;flex-direction:column;gap:14px}.row{display:grid;grid-template-columns:minmax(80px,115px) minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:12px}.row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:6px;background:#111111;border-radius:4px;overflow:hidden}.fill{height:100%;background:#737373;border-radius:4px}.num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}.list{display:flex;flex-direction:column}.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-soft);font-size:12px}.item:last-child{border:0}.path{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.count{color:var(--muted);font-variant-numeric:tabular-nums}.empty{min-height:150px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px}.empty strong{display:block;color:var(--text);font-size:13px;margin-bottom:6px}.muted{color:var(--muted)}.hint{font-size:11px;color:var(--muted)}.alert{padding:12px 15px;border:1px solid #7d3331;border-radius:6px;background:#1a0b0b;color:#ffb1ac;margin-bottom:22px;display:none}.alert.show{display:block}.notice{background:#0d0d0d;border:1px solid var(--border);padding:15px 17px;border-radius:6px;color:var(--muted);font-size:12px;line-height:1.65}.notice strong{color:var(--text)}.status-line{display:flex;align-items:center;gap:9px}.badge{border:1px solid var(--border);border-radius:30px;padding:2px 8px;font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}.tabs button{padding:9px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted)}.tabs button.active{border-bottom-color:#bcbcbc;color:var(--text);font-weight:600}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th{text-align:left;color:var(--muted);font-weight:500;background:#0d0d0d}.data-table th,.data-table td{padding:11px 15px;border-bottom:1px solid var(--border-soft)}.data-table tr:last-child td{border-bottom:0}.data-table td:last-child,.data-table th:last-child{text-align:right}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}.field input{background:#050505;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px}.stack{display:flex;flex-direction:column;gap:16px}.mini-kpi{font-size:23px;font-weight:600;letter-spacing:-.4px}.foot{border-top:1px solid var(--border-soft);padding-top:18px;margin-top:36px;color:var(--subtle);font-size:11px;display:flex;justify-content:space-between}.hidden{display:none!important}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:1fr 1fr}.content{padding:26px}.sidebar{width:210px}.shell{grid-template-columns:210px minmax(0,1fr)}}
@media(max-width:760px){.shell{display:block}.sidebar{position:fixed;z-index:20;left:0;top:0;width:245px;transform:translateX(-105%);transition:transform .18s;background:var(--bg);box-shadow:20px 0 50px #0008}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-flex}.topbar{padding:0 16px}.content{padding:22px 16px 40px}.two,.equal,.three{grid-template-columns:1fr}.page-head{flex-direction:column;gap:12px}.top-actions .pill{display:none}.chart{height:200px}.row{grid-template-columns:90px minmax(0,1fr) 55px}.page-head h1{font-size:23px}}
@media(max-width:420px){.cards{gap:8px}.metric{padding:12px}.metric .value{font-size:21px}.head-actions{width:100%}.page-head{margin-bottom:20px}}
</style></head><body><div class="shell">
<aside class="sidebar" id="sidebar"><a href="#overview" class="brand"><div class="mark">𖦏</div><div><b>opel</b><small>Сетевая аналитика</small></div></a><div><div class="nav-title">Рабочая область</div><nav class="nav" id="nav"></nav></div><div class="sidebar-bottom"><div>Аналитика Cloudflare</div><div style="margin-top:6px">Личная рабочая область · <a href="https://opel.org.uk" target="_blank" rel="noopener">Открыть сайт ↗</a></div></div></aside>
<div class="main"><div class="topbar"><div class="crumb"><button class="btn flat small mobile-menu" id="menu" aria-label="Открыть навигацию">☰</button><span>opel.org.uk</span><span>/</span><strong id="crumb">Обзор</strong></div><div class="top-actions"><span class="pill"><span class="dot" id="statusDot"></span><span id="apiStatusText">Подключение</span></span><button class="btn small" id="refresh">↻ Обновить</button></div></div><main class="content"><div id="error" class="alert" role="alert"></div><div id="view"></div><footer class="foot"><span>opel / сетевая аналитика</span><span id="updated">Ещё не загружено</span></footer></main></div></div>
<script>
const $=id=>document.getElementById(id);const fmt=new Intl.NumberFormat('ru-RU');const countryNames=new Intl.DisplayNames(['ru'],{type:'region'});
function escapeHtml(value){return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));}
function formatBytes(bytes){if(!Number.isFinite(bytes))return "—";const units=["B","KB","MB","GB","TB"];let n=bytes,i=0;while(n>=1024&&i<units.length-1){n/=1024;i++;}return `${n>=10||i===0?n.toFixed(0):n.toFixed(1)} ${units[i]}`;}
function countryLabel(value){if(!value)return "Неизвестно";try{return countryNames.of(value) || value;}catch{return value;}}
function setStatus(ok,text){$("apiStatus").classList.toggle("error",!ok);$("apiStatusText").textContent=text;}
function showError(msg){$("error").textContent=msg;$("error").classList.add("show");}
function clearError(){$("error").classList.remove("show");}

function deviceLabel(value){const labels={'desktop':'Компьютер','mobile':'Телефон','tablet':'Планшет','other':'Другое','unknown':'Неизвестно','bot':'Бот','smart tv':'Умный телевизор'};return labels[String(value??'').toLowerCase()]||value;}
function renderBars(el, rows, formatter=(x)=>fmt.format(x)){
 const clean=rows.filter(x=>Number.isFinite(Number(x.value))&&Number(x.value)>0); const max=Math.max(...clean.map(x=>Number(x.value)),1);
 el.innerHTML=clean.length?clean.map(x=>`<div class="row"><span class="name" title="${escapeHtml(x.name)}">${escapeHtml(x.name)}</span><span class="track"><span class="fill" style="width:${Math.max(2,(Number(x.value)/max)*100)}%"></span></span><span class="num">${formatter(Number(x.value))}</span></div>`).join(""):"<div class=\"empty\">Нет данных за этот период.</div>";
}
function renderList(el, rows){
 el.innerHTML=rows.length?rows.map(x=>`<div class="item"><span class="path" title="${escapeHtml(x.name)}">${escapeHtml(x.name)}</span><span class="count">${fmt.format(Number(x.value)||0)}</span></div>`).join(""):"<div class=\"empty\">Нет данных за этот период.</div>";
}
function renderChart(el, rows){
 const max=Math.max(...rows.map(x=>Number(x.value)||0),1);
 el.innerHTML=rows.length?rows.map((x,i)=>{const h=Math.max(2,((Number(x.value)||0)/max)*100);const label=x.label||"";return `<div class="bar-col" title="${escapeHtml(label)}: ${fmt.format(Number(x.value)||0)}"><div class="bar" style="height:${h}%"></div><span>${i%Math.ceil(rows.length/7)===0?escapeHtml(label):""}</span></div>`;}).join(""):"<div class=\"empty\">Нет данных за этот период.</div>";
}
function renderOverview(statuses){
 const totals={"2xx":0,"3xx":0,"4xx":0,"5xx":0};statuses.forEach(s=>{const n=Number(s.name);if(n>=200&&n<300)totals["2xx"]+=Number(s.value)||0;else if(n>=300&&n<400)totals["3xx"]+=Number(s.value)||0;else if(n>=400&&n<500)totals["4xx"]+=Number(s.value)||0;else if(n>=500&&n<600)totals["5xx"]+=Number(s.value)||0;});const total=Object.values(totals).reduce((a,b)=>a+b,0);const rows=Object.entries(totals).map(([name,value])=>({name,value,pct:total?(value/total*100):0}));const max=Math.max(...rows.map(x=>x.value),1);$("overview").innerHTML=rows.map(x=>`<div class="row"><span class="name">${x.name}</span><span class="track"><span class="fill" style="width:${Math.max(x.value?2:0,(x.value/max)*100)}%"></span></span><span class="num">${x.pct.toFixed(1)}%</span></div>`).join("");}


const PAGES=[['overview','Обзор','▦'],['traffic','Трафик','▥'],['visitors','Посетители','◎'],['security','Безопасность','◇'],['health','Состояние сервисов','♡'],['reports','Отчёты','▤'],['settings','Настройки','⚙']];
const state={data:null,range:localStorage.getItem('opel-range')||'7d',metric:'requests',loading:false,lastUpdated:null,health:[],healthBusy:false,compare:false,autoRefresh:false};
function setStatus(ok,text){$('statusDot').classList.toggle('error',!ok);$('apiStatusText').textContent=text}
function showError(msg){$('error').textContent=msg;$('error').classList.add('show')}
function clearError(){$('error').classList.remove('show')}
function page(){const p=location.hash.replace('#','').split('?')[0];return PAGES.some(x=>x[0]===p)?p:'overview'}
function rangeControl(){return `<select class="select" id="range" aria-label="Диапазон дат"><option value="24h" ${state.range==='24h'?'selected':''}>Последние 24 часа</option><option value="7d" ${state.range==='7d'?'selected':''}>Последние 7 дней</option><option value="30d" ${state.range==='30d'?'selected':''}>Последние 30 дней</option></select>`}
function header(title,subtitle,extra=''){return `<div class="page-head"><div><div class="eyebrow">Аналитика / ${escapeHtml(title)}</div><h1>${escapeHtml(title)}</h1><p>${escapeHtml(subtitle)}</p></div><div class="head-actions">${extra}</div></div>`}
function panel(title,body,aside=''){return `<section class="panel"><div class="panel-header"><h3>${title}</h3><small>${aside}</small></div><div class="panel-body">${body}</div></section>`}
function metric(label,value,note=''){return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div><div class="note">${note}</div></div>`}
function noData(msg='Нет данных за этот период.'){return `<div class="empty">${msg}</div>`}
function tableRows(rows,head1='Название',head2='Запросы'){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>${head1}</th><th>${head2}</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${fmt.format(Number(x.value)||0)}</td></tr>`).join(''):`<tr><td colspan="2" class="muted">Нет данных за этот период</td></tr>`}</tbody></table></div>`}
function renderNav(){const p=page();$('crumb').textContent=PAGES.find(x=>x[0]===p)[1];$('nav').innerHTML=PAGES.map(([id,name,icon])=>`<button data-page="${id}" class="${id===p?'active':''}" aria-current="${id===p?'page':'false'}"><span style="width:18px;text-align:center;font-size:17px">${icon}</span>${name}</button>`).join('')}
function overview(d){const s=d.summary;return header('Обзор','Краткий обзор активности вашей сети.',rangeControl())+`<div class="cards">${metric('Запросы',fmt.format(s.requests),'Запросы на периферии Cloudflare')}${metric('Посещения',fmt.format(s.visits),'Посещения по данным Cloudflare')}${metric('Объём трафика',formatBytes(s.bandwidth),'Байты ответов периферийной сети')}${metric('Доля успешных запросов',Number(s.successRate).toFixed(1)+'%','HTTP 2xx и 3xx')}</div><div class="divider"></div><div class="section-head"><div><h2>Активность трафика</h2><p>Запросы за выбранный период</p></div><button class="section-link" data-go="traffic">Подробнее о трафике →</button></div><div class="grid two">${panel('Объём запросов','<div class="chart" id="trafficChart"></div>','Cloudflare GraphQL')}${panel('Страны-лидеры','<div class="rows" id="countries"></div>','По посещениям')}</div><div class="divider"></div><div class="section-head"><h2>Краткая сводка</h2></div><div class="grid three">${panel('HTTP-статусы','<div class="rows" id="statuses"></div>','Запросы')}${panel('Популярные пути','<div class="list" id="paths"></div>','Запросы')}${panel('Типы устройств','<div class="rows" id="devices"></div>','Посещения')}</div>`}
function traffic(d){const s=d.summary;return header('Трафик','Динамика запросов, коды ответов и популярные URL.',rangeControl())+`<div class="cards">${metric('Запросы',fmt.format(s.requests))}${metric('Посещения',fmt.format(s.visits))}${metric('Объём трафика',formatBytes(s.bandwidth))}${metric('Доля успешных запросов',Number(s.successRate).toFixed(1)+'%')}</div><div class="divider"></div><div class="section-head"><div><h2>Активность запросов</h2><p>Временная шкала и распределение запросов</p></div><button class="btn small" id="exportTraffic">Экспорт CSV с трафиком ↓</button></div>${panel('Запросы во времени','<div class="chart" id="trafficChart"></div>','Выбранный период')}<div style="height:16px"></div><div class="grid equal">${panel('Популярные пути',tableRows(d.paths,'Путь','Запросы'))}${panel('Коды ответов HTTP',tableRows(d.statuses,'Статус','Запросы'))}</div><div style="height:16px"></div>${panel('Распределение по дням и часам',`<div class="notice"><strong>Тепловая карта по часам</strong><br>Для этого раздела нужны почасовые данные с временными метками из API аналитики. Текущий API предоставляет интервалы трафика для графика выше; подробную тепловую карту и сравнение с предыдущими периодами можно добавить, когда API начнёт возвращать необходимые данные.</div>`)}`}
function visitors(d){return header('Посетители','Откуда приходят посетители и как они просматривают сайт.',rangeControl())+`<div class="grid two">${panel('Страны','<div class="rows" id="countries"></div>','Посещения')}${panel('Устройства','<div class="rows" id="devices"></div>','Посещения')}</div><div style="height:16px"></div>${panel('Распределение по странам',tableRows(d.countries.map(x=>({...x,name:countryLabel(x.name)})),'Страна','Посещения'))}<div style="height:16px"></div>${panel('Источники переходов и географическая карта',`<div class="notice"><strong>Нужны дополнительные аналитические данные</strong><br>Сайты-источники переходов и географическая карта появятся здесь, когда API Cloudflare начнёт возвращать данные об источниках и распределении по странам. Местоположение посетителей не определяется предположительно и не выдумывается.</div>`)}`}
function security(d){return header('Безопасность','Действия межсетевого экрана, автоматизированный трафик и потенциальные угрозы.',rangeControl())+`<div class="notice"><strong>Данные безопасности пока не подключены.</strong><br>Текущий API <code>/api/analytics</code> возвращает количество запросов и HTTP-статусы, но не события WAF, оценки ботов, заблокированные запросы или результаты проверок. Для этого нужны дополнительные запросы к API безопасности Cloudflare; доступность зависит от вашего тарифа.</div><div style="height:20px"></div><div class="grid equal">${panel('Распределение HTTP-ответов','<div class="rows" id="statuses"></div>','Не количество угроз')}${panel('Сводка ответов','<div class="rows" id="overview"></div>','По классам статусов')}</div><div style="height:16px"></div>${panel('Хронология событий безопасности',noData('Подключите события безопасности Cloudflare, чтобы отображать подтверждённую активность межсетевого экрана.'))}`}
const endpoints=[{name:'Основной сайт',url:'https://opel.org.uk'},{name:'Панель управления',url:'https://dash.opel.org.uk'}];
function health(){return header('Состояние сервисов','Проверки конечных точек и доступности сервисов.',`<button class="btn" id="checkHealth" ${state.healthBusy?'disabled':''}>Запустить проверки</button>`)+`<div class="notice"><strong>Только проверки по запросу.</strong><br>Проверки в браузере дают лишь приблизительный результат: из-за междоменных ограничений они не позволяют надёжно определить историю доступности, HTTP-статус или время ответа. Для точной истории доступности и отчётов об инцидентах нужен мониторинг по расписанию через Cloudflare Workers.</div><div style="height:18px"></div>${panel('Отслеживаемые адреса',`<div class="stack">${endpoints.map((x,i)=>{const h=state.health[i];return `<div class="item"><span>${escapeHtml(x.name)} <span class="muted">· ${escapeHtml(x.url)}</span></span><span class="badge">${h?escapeHtml(h):'Не проверено'}</span></div>`}).join('')}</div>`)}<div style="height:16px"></div>${panel('История доступности за 30 дней',noData('Исторические проверки не настроены.'))}`}
function reports(d){return header('Отчёты','Экспортируйте данные и ведите журнал активности сети.',rangeControl())+`<div class="grid equal">${panel('Экспорт трафика',`<div class="stack"><div class="muted">Скачайте данные о трафике, которые Cloudflare возвращает за выбранный период.</div><div><button class="btn primary" id="exportTraffic">Скачать CSV с трафиком</button></div></div>`)}${panel('Экспорт детализации',`<div class="stack"><div class="muted">Экспортируйте страны, устройства, популярные пути и статусы ответов в файл CSV.</div><div><button class="btn" id="exportBreakdown">Скачать CSV с детализацией</button></div></div>`)}</div><div style="height:16px"></div>${panel('Отчёты по расписанию',`<div class="notice"><strong>Не настроено</strong><br>Для автоматических ежедневных сводок и отправки отчётов по электронной почте нужны фоновое задание по расписанию и сервис доставки. Ручной экспорт CSV уже работает.</div>`)}`}
function settings(){return header('Настройки','Настройки рабочего пространства аналитики.')+`${panel('Внешний вид',`<div class="status-line"><span>Тема</span><span class="badge">Тёмная · в стиле системы</span></div>`)}<div style="height:16px"></div>${panel('Настройки обновления',`<div class="stack"><label class="field">Диапазон дат по умолчанию ${rangeControl()}</label><label class="status-line"><input type="checkbox" id="autoRefresh" ${state.autoRefresh?'checked':''}> Обновлять аналитику каждые 5 минут, пока открыта эта страница</label><span class="hint">Ваш выбор сохраняется только в этом браузере.</span></div>`)}<div style="height:16px"></div>${panel('Источник данных',`<div class="stack"><div>Аналитика Cloudflare <span class="badge">/api/analytics</span></div><div class="muted">Для событий WAF, мониторинга доступности, источников переходов и уведомлений нужны дополнительные интеграции с API.</div></div>`)}`}
function draw(){renderNav();const p=page(),d=state.data;if(!d&&p!=='health'&&p!=='settings'){$('view').innerHTML=header(PAGES.find(x=>x[0]===p)[1],'Сетевая аналитика Cloudflare.')+panel('Источник данных',noData(state.loading?'Загрузка аналитики Cloudflare…':'Данные аналитики не загружены. Нажмите «Обновить», чтобы повторить попытку.'));return}const fn={overview:()=>overview(d),traffic:()=>traffic(d),visitors:()=>visitors(d),security:()=>security(d),health, reports:()=>reports(d),settings};$('view').innerHTML=fn[p]();if(d){if($('trafficChart'))renderChart($('trafficChart'),d.traffic||[]);if($('countries'))renderBars($('countries'),(d.countries||[]).map(x=>({...x,name:countryLabel(x.name)})));if($('paths'))renderList($('paths'),d.paths||[]);if($('devices'))renderBars($('devices'),(d.devices||[]).map(x=>({...x,name:deviceLabel(x.name)})));if($('statuses'))renderBars($('statuses'),d.statuses||[]);if($('overview'))renderOverview(d.statuses||[])} }
async function load(){if(state.loading)return;state.loading=true;clearError();$('refresh').disabled=true;setStatus(true,'Загрузка');if(!state.data)draw();try{const res=await fetch('/api/analytics?range='+encodeURIComponent(state.range),{credentials:'include',cache:'no-store'});let d;try{d=await res.json()}catch{throw new Error('API аналитики вернул ответ '+res.status)}if(!res.ok)throw new Error(d.error||'Ошибка запроса аналитики ('+res.status+')');if(!d.summary||!Array.isArray(d.traffic))throw new Error('Неожиданный ответ API аналитики');state.data=d;state.lastUpdated=new Date();$('updated').textContent='Обновлено '+state.lastUpdated.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});setStatus(true,'Аналитика подключена')}catch(e){setStatus(false,'Ошибка аналитики');showError(e.message||'Не удалось загрузить аналитику');}finally{state.loading=false;$('refresh').disabled=false;draw()}}
function downloadCSV(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportTraffic(){const d=state.data;if(!d)return;downloadCSV('opel-traffic-'+state.range+'.csv',[['Время','Запросы'],...(d.traffic||[]).map(x=>[x.label,x.value])])}
function exportBreakdown(){const d=state.data;if(!d)return;const rows=[['Категория','Название','Количество']];for(const [key,values] of [['Страны',d.countries],['Устройства',d.devices],['Пути',d.paths],['HTTP-статусы',d.statuses]])for(const x of values||[])rows.push([key,key==='Страны'?countryLabel(x.name):x.name,x.value]);downloadCSV('opel-breakdown-'+state.range+'.csv',rows)}
async function checkHealth(){state.healthBusy=true;draw();await Promise.all(endpoints.map(async(x,i)=>{try{await fetch(x.url,{mode:'no-cors',cache:'no-store',signal:AbortSignal.timeout(7000)});state.health[i]='Запрос выполнен · статус не проверен'}catch{state.health[i]='Недоступно или заблокировано'}}));state.healthBusy=false;draw()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){location.hash=nav.dataset.page;$('sidebar').classList.remove('open')}const go=e.target.closest('[data-go]');if(go)location.hash=go.dataset.go;if(e.target.closest('#exportTraffic'))exportTraffic();if(e.target.closest('#exportBreakdown'))exportBreakdown();if(e.target.closest('#checkHealth'))checkHealth()});document.addEventListener('change',e=>{if(e.target.id==='range'){state.range=e.target.value;localStorage.setItem('opel-range',state.range);load()}if(e.target.id==='autoRefresh'){state.autoRefresh=e.target.checked;localStorage.setItem('opel-auto-refresh',state.autoRefresh?'1':'0')}});$('menu').addEventListener('click',()=>$('sidebar').classList.toggle('open'));$('refresh').addEventListener('click',load);window.addEventListener('hashchange',draw);state.autoRefresh=localStorage.getItem('opel-auto-refresh')==='1';setInterval(()=>{if(state.autoRefresh&&!document.hidden)load()},300000);draw();load();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
